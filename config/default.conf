server {
    listen 8080;
    host 127.0.0.1;
    client_max_body_size 20M;
    error_page 404 www/errors/404.html;
    error_page 500 www/errors/500.html;

    location / {
        methods GET POST;
        root www;
        index index.html;
        directory_listing on;
    }

    location /upload {
        methods POST DELETE;
        root www/uploads;
        upload_store www/uploads;
        directory_listing on;
    }

    location /post-only {
        methods POST;
        root www;
        upload_store www/uploads;
    }

    location /old {
        methods GET;
        redirect /;
    }

    location /cgi-bin {
        methods GET POST;
        root www/cgi-bin;

        cgi_pass .py /usr/bin/python3;
        cgi_pass .php /usr/bin/php;
    }
}

server {
    listen 8081;
    host 127.0.0.1;
    client_max_body_size 20M;

    location / {
        methods GET POST;
        root www;
        index index.html;
        directory_listing on;
    }
}